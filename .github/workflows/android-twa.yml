name: android-twa

# Buduje aplikację Android (Trusted Web Activity) z katalogu android-twa/.
# Wynik: NIEPODPISANY release AAB (do podpisania lokalnie kluczem uploadu) + debug APK do testu.
# Bez sekretów. Opis podpisywania i Play Console: android-twa/README.md.

on:
  workflow_dispatch:
  push:
    paths:
      - "android-twa/**"
      - ".github/workflows/android-twa.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-twa
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Bez gradle-wrapper.jar w repo: przypięta wersja Gradle z setup-gradle (AGP 9.5 wymaga >= 9.6).
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.9.2"

      - name: Build (bundleRelease bez podpisu + assembleDebug)
        run: gradle --no-daemon --stacktrace bundleRelease assembleDebug

      - name: Zbierz artefakty
        run: |
          mkdir -p ../dist
          cp app/build/outputs/bundle/release/app-release.aab ../dist/app-release-unsigned.aab
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/app-debug.apk
          ls -l ../dist
          sha256sum ../dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: bitrymdym-android-${{ github.sha }}
          path: |
            dist/app-release-unsigned.aab
            dist/app-debug.apk
          if-no-files-found: error
