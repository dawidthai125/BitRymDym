name: CI (PR)

# Checks every pull request into main before it is merged (owner order 2026-11-26):
# typecheck, lint, unit tests, production build. Nothing is deployed and no secret is used:
# the build gets placeholder public values (the real ones are in the vercel-production environment).
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: tsc
        run: npx tsc --noEmit -p .
      - name: eslint
        run: npx eslint .
      - name: vitest
        run: npx vitest run
      - name: next build
        env:
          NEXT_PUBLIC_SITE_URL: https://ci.invalid
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ci-placeholder
        run: npx next build
