name: recorder-installer

# Buduje instalator Windows nagrywarki (PyInstaller + Inno Setup). Uruchamiany ręcznie albo tagiem recorder-v*.
# Czcionki nie leżą w repo: bierze je z poprzedniego instalatora (cicha instalacja na runnerze).
# ffmpeg i ffplay (GPL, build full shared) pobiera z GyanD/codexffmpeg w przypiętej wersji.
# Wynik to artefakt BitRymDym-Setup.exe + suma SHA-256. Wgranie na R2 robi właściciel (docs/WINDOWS_NAGRYWARKA.md).

on:
  push:
    tags:
      - "recorder-v*"
  workflow_dispatch:
    inputs:
      base_installer_url:
        description: "Poprzedni instalator (źródło czcionek)"
        default: "https://pub-8c6908a0590848aeb53ab34c2317d857.r2.dev/bitrymdym/BitRymDym-Setup.exe"
      ffmpeg_tag:
        description: "Wersja ffmpeg (GyanD/codexffmpeg, build full shared z ffplay)"
        default: "9.0.2"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testy modułów programu (Windows, w tym DPAPI)
        working-directory: desktop/recorder
        run: |
          $env:TEMP = $env:RUNNER_TEMP
          python record_wav.py "$env:RUNNER_TEMP\t.wav"; if ($LASTEXITCODE) { throw "record_wav" }
          python desk.py;            if ($LASTEXITCODE) { throw "desk" }
          python account_upload.py;  if ($LASTEXITCODE) { throw "account_upload" }
          python own_fx.py;          if ($LASTEXITCODE) { throw "own_fx" }
          python offline_session.py; if ($LASTEXITCODE) { throw "offline_session" }
          python win_output.py;      if ($LASTEXITCODE) { throw "win_output" }
          python test_updater.py;    if ($LASTEXITCODE) { throw "updater" }
          $app = (Select-String -Path updater.py -Pattern 'APP_VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          $iss = (Select-String -Path installer\BitRymDym.iss -Pattern '#define AppVersion "([^"]+)"').Matches[0].Groups[1].Value
          if ($app -ne $iss) { throw "wersja programu ($app) różni się od AppVersion w .iss ($iss)" }
          "wersja programu i instalatora: $app" | Write-Host

      - name: Czcionki i ffmpeg z poprzedniego instalatora
        env:
          BASE_URL: ${{ inputs.base_installer_url || 'https://pub-8c6908a0590848aeb53ab34c2317d857.r2.dev/bitrymdym/BitRymDym-Setup.exe' }}
        run: |
          $base = Join-Path $env:RUNNER_TEMP "base"
          Invoke-WebRequest -Uri $env:BASE_URL -OutFile (Join-Path $env:RUNNER_TEMP "base.exe")
          $p = Start-Process (Join-Path $env:RUNNER_TEMP "base.exe") -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$base" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "poprzedni instalator: kod $($p.ExitCode)" }
          Get-ChildItem $base | Select-Object Name, Length | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
          if (-not (Test-Path (Join-Path $base "fonts"))) { throw "w poprzednim instalatorze brak katalogu fonts" }
          $extras = Join-Path $env:RUNNER_TEMP "extras"
          New-Item -ItemType Directory -Force $extras | Out-Null
          Get-ChildItem $base | Where-Object { $_.Name -notin @("BitRymDym.exe","_internal","brd-cassette.ico") -and $_.Name -notlike "unins*" } |
            ForEach-Object { Copy-Item $_.FullName $extras -Recurse -Force }
          Get-ChildItem $extras | Select-Object Name | Format-Table -AutoSize | Out-String | Write-Host

      - name: ffmpeg i ffplay (Gyan full, shared)
        env:
          FFMPEG_TAG: ${{ inputs.ffmpeg_tag || '9.0.2' }}
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          Invoke-WebRequest -Uri "https://github.com/GyanD/codexffmpeg/releases/download/$env:FFMPEG_TAG/ffmpeg-$env:FFMPEG_TAG-full_build-shared.zip" -OutFile $zip
          $out = Join-Path $env:RUNNER_TEMP "ffmpeg"
          Expand-Archive $zip $out -Force
          $root = (Get-ChildItem $out -Directory | Select-Object -First 1).FullName
          $extras = Join-Path $env:RUNNER_TEMP "extras"
          Remove-Item (Join-Path $extras "ffmpeg.exe") -ErrorAction SilentlyContinue
          foreach ($exe in "ffmpeg.exe","ffplay.exe") {
            if (-not (Test-Path "$root\bin\$exe")) { throw "w buildzie ffmpeg brak $exe" }
            Copy-Item "$root\bin\$exe" $extras -Force
          }
          Copy-Item "$root\bin\*.dll" $extras -Force
          if (Test-Path "$root\LICENSE") { Copy-Item "$root\LICENSE" (Join-Path $extras "FFMPEG-LICENSE.txt") -Force }
          & "$extras\ffmpeg.exe" -hide_banner -version | Select-Object -First 1 | Write-Host
          & "$extras\ffplay.exe" -hide_banner -version | Select-Object -First 1 | Write-Host
          $dev = & "$extras\ffmpeg.exe" -hide_banner -devices 2>&1 | Out-String
          if ($dev -notmatch "dshow") { throw "ffmpeg bez dshow (mikrofon)" }
          Get-ChildItem $extras | Measure-Object Length -Sum | ForEach-Object { "extras: $($_.Count) plików, $([math]::Round($_.Sum/1MB)) MB" } | Write-Host

      - name: PyInstaller
        working-directory: desktop/recorder
        run: |
          python -m pip install --upgrade pip pyinstaller
          pyinstaller BitRymDym.spec --noconfirm
          if ($LASTEXITCODE) { throw "pyinstaller" }
          Copy-Item "$env:RUNNER_TEMP\extras\*" "dist\BitRymDym" -Recurse -Force
          Get-ChildItem "dist\BitRymDym" | Select-Object Name, Length | Format-Table -AutoSize | Out-String -Width 200 | Write-Host

      - name: Smoke exe z katalogu dist
        working-directory: desktop/recorder
        run: |
          $note = Join-Path $env:TEMP "bitrymdym-exe-smoke.txt"
          Remove-Item $note -ErrorAction SilentlyContinue
          $env:BITRYMDYM_UI_SMOKE = "1"
          $p = Start-Process "dist\BitRymDym\BitRymDym.exe" -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw "smoke: program nie zakończył się w 90 s" }
          if (-not (Test-Path $note)) { throw "smoke: brak pliku wyniku" }
          Get-Content $note | Write-Host
          $text = Get-Content $note -Raw
          if ($text -notmatch "ffmpeg=") { throw "smoke: brak ffmpeg w wyniku" }
          if ($text -notmatch "ffplay=" -or $text -match "ffplay=None") { throw "smoke: program nie widzi ffplay" }

      - name: Inno Setup
        working-directory: desktop/recorder
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "installer\BitRymDym.iss"
          if ($LASTEXITCODE) { throw "iscc" }
          $exe = "installer\output\BitRymDym-Setup.exe"
          (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower() + "  BitRymDym-Setup.exe" | Out-File "installer\output\BitRymDym-Setup.exe.sha256" -Encoding ascii
          Get-ChildItem installer\output | Select-Object Name, Length | Format-Table -AutoSize | Out-String | Write-Host

      - name: Cicha instalacja nowego instalatora i smoke zainstalowanej wersji
        working-directory: desktop/recorder
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "new"
          $p = Start-Process "installer\output\BitRymDym-Setup.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "nowy instalator: kod $($p.ExitCode)" }
          foreach ($need in "BitRymDym.exe","ffmpeg.exe","ffplay.exe","FFMPEG-LICENSE.txt","fonts") { if (-not (Test-Path (Join-Path $dir $need))) { throw "po instalacji brak: $need" } }
          & (Join-Path $dir "ffplay.exe") -hide_banner -version | Select-Object -First 1 | Write-Host
          & (Join-Path $dir "ffmpeg.exe") -hide_banner -version | Select-Object -First 1 | Write-Host
          $note = Join-Path $env:TEMP "bitrymdym-exe-smoke.txt"
          Remove-Item $note -ErrorAction SilentlyContinue
          $env:BITRYMDYM_UI_SMOKE = "1"
          $q = Start-Process (Join-Path $dir "BitRymDym.exe") -PassThru
          if (-not $q.WaitForExit(90000)) { $q.Kill(); throw "smoke po instalacji: czas" }
          if (-not (Test-Path $note)) { throw "smoke po instalacji: brak wyniku" }
          $installed = Get-Content $note -Raw
          $installed | Write-Host
          if ($installed -notmatch "ffplay=" -or $installed -match "ffplay=None") { throw "po instalacji program nie widzi ffplay" }
          if ($installed -notmatch "\\new\\ffmpeg\.exe" -or $installed -notmatch "\\new\\ffplay\.exe") { throw "po instalacji program nie używa dołączonego ffmpeg/ffplay" }
          # Ścieżka samoaktualizacji: instalator z tymi samymi argumentami co updater.py (/UPDATE=1) ma uruchomić program.
          # Plik, którego nowa budowa nie zawiera, ma zniknąć (przeskok wersji nie zostawia plików pośrednich).
          Remove-Item $note -ErrorAction SilentlyContinue
          $env:BITRYMDYM_UI_SMOKE = "1"
          $junk = Join-Path $dir "stary-plik-posredniej-wersji.txt"
          Set-Content -Path $junk -Value "stary" -Encoding ascii
          $u = Start-Process "installer\output\BitRymDym-Setup.exe" -ArgumentList "/SILENT","/SUPPRESSMSGBOXES","/NORESTART","/UPDATE=1","/DIR=$dir" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "aktualizacja: kod $($u.ExitCode)" }
          if (Test-Path $junk) { throw "aktualizacja zostawiła plik, którego nie ma w nowej wersji" }
          foreach ($need in "BitRymDym.exe","ffmpeg.exe","ffplay.exe","fonts") { if (-not (Test-Path (Join-Path $dir $need))) { throw "po aktualizacji brak: $need" } }
          for ($i = 0; $i -lt 40 -and -not (Test-Path $note); $i++) { Start-Sleep -Seconds 2 }
          if (-not (Test-Path $note)) { throw "aktualizacja (/UPDATE=1) nie uruchomiła programu po instalacji" }
          "aktualizacja /UPDATE=1: program uruchomiony po instalacji" | Write-Host

      - uses: actions/upload-artifact@v4
        with:
          name: BitRymDym-Setup
          path: |
            desktop/recorder/installer/output/BitRymDym-Setup.exe
            desktop/recorder/installer/output/BitRymDym-Setup.exe.sha256
          retention-days: 7
          if-no-files-found: error
