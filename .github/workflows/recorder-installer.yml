name: recorder-installer

# Buduje instalator Windows nagrywarki (PyInstaller + Inno Setup). Uruchamiany ręcznie albo tagiem recorder-v*.
# Czcionki nie leżą w repo: bierze je z poprzedniego instalatora (cicha instalacja na runnerze).
# ffmpeg i ffplay (GPL, build full shared) pobiera z GyanD/codexffmpeg w przypiętej wersji.
# Wynik to artefakt BitRymDym-Setup.exe i BitRymDym-Portable.zip (wersja bez instalacji, sama się aktualizuje) + sumy SHA-256. Wgranie na R2 robi właściciel (docs/WINDOWS_NAGRYWARKA.md).

on:
  push:
    tags:
      - "recorder-v*"
  workflow_dispatch:
    inputs:
      base_installer_url:
        description: "Poprzedni instalator (źródło czcionek)"
        default: "https://pub-8c6908a0590848aeb53ab34c2317d857.r2.dev/bitrymdym/BitRymDym-Setup-2026.11.13.17.exe"
      ffmpeg_tag:
        description: "Wersja ffmpeg (GyanD/codexffmpeg, build full shared z ffplay)"
        default: "9.0.2"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testy modułów programu (Windows, w tym DPAPI)
        working-directory: desktop/recorder
        run: |
          $env:TEMP = $env:RUNNER_TEMP
          python record_wav.py "$env:RUNNER_TEMP\t.wav"; if ($LASTEXITCODE) { throw "record_wav" }
          python desk.py;            if ($LASTEXITCODE) { throw "desk" }
          python -c "import record_app; record_app.password_keep_self_test()"; if ($LASTEXITCODE) { throw "haslo" }
          python account_upload.py;  if ($LASTEXITCODE) { throw "account_upload" }
          python own_fx.py;          if ($LASTEXITCODE) { throw "own_fx" }
          python offline_session.py; if ($LASTEXITCODE) { throw "offline_session" }
          python -m pip install -q numpy==2.3.5; if ($LASTEXITCODE) { throw "numpy" }
          python auto_align.py;      if ($LASTEXITCODE) { throw "auto_align" }
          python countin.py;         if ($LASTEXITCODE) { throw "countin" }
          python timeline.py;        if ($LASTEXITCODE) { throw "timeline" }
          python win_output.py;      if ($LASTEXITCODE) { throw "win_output" }
          python test_updater.py;    if ($LASTEXITCODE) { throw "updater" }
          python test_project_return.py; if ($LASTEXITCODE) { throw "project_return" }
          python test_commands.py;   if ($LASTEXITCODE) { throw "commands" }
          $app = (Select-String -Path updater.py -Pattern 'APP_VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          $iss = (Select-String -Path installer\BitRymDym.iss -Pattern '#define AppVersion "([^"]+)"').Matches[0].Groups[1].Value
          if ($app -ne $iss) { throw "wersja programu ($app) różni się od AppVersion w .iss ($iss)" }
          "wersja programu i instalatora: $app" | Write-Host

      - name: Czcionki i ffmpeg z poprzedniego instalatora
        env:
          BASE_URL: ${{ inputs.base_installer_url || 'https://pub-8c6908a0590848aeb53ab34c2317d857.r2.dev/bitrymdym/BitRymDym-Setup-2026.11.13.17.exe' }}
        run: |
          $base = Join-Path $env:RUNNER_TEMP "base"
          Invoke-WebRequest -Uri $env:BASE_URL -OutFile (Join-Path $env:RUNNER_TEMP "base.exe")
          # Przypięta suma: podmieniony plik w buckecie nie wejdzie do buildu.
          if ($env:BASE_URL.EndsWith("BitRymDym-Setup-2026.11.13.17.exe")) {
            $sum = (Get-FileHash (Join-Path $env:RUNNER_TEMP "base.exe") -Algorithm SHA256).Hash.ToLower()
            if ($sum -ne "1b19d3deba23a65da6160cb0c54cec99135f22d301ee9eac68ee59d190f77984") { throw "poprzedni instalator: inna suma ($sum)" }
          }
          $p = Start-Process (Join-Path $env:RUNNER_TEMP "base.exe") -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$base" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "poprzedni instalator: kod $($p.ExitCode)" }
          Get-ChildItem $base | Select-Object Name, Length | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
          if (-not (Test-Path (Join-Path $base "fonts"))) { throw "w poprzednim instalatorze brak katalogu fonts" }
          $extras = Join-Path $env:RUNNER_TEMP "extras"
          New-Item -ItemType Directory -Force $extras | Out-Null
          Get-ChildItem $base | Where-Object { $_.Name -notin @("BitRymDym.exe","_internal","brd-cassette.ico") -and $_.Name -notlike "unins*" } |
            ForEach-Object { Copy-Item $_.FullName $extras -Recurse -Force }
          Get-ChildItem $extras | Select-Object Name | Format-Table -AutoSize | Out-String | Write-Host

      - name: Najmniejsze okno z czcionkami programu
        working-directory: desktop/recorder
        run: |
          Copy-Item (Join-Path $env:RUNNER_TEMP "base\fonts") fonts -Recurse -Force
          python -m pip install -q pillow==12.0.0; if ($LASTEXITCODE) { throw "pillow" }
          python test_small_window.py "$env:RUNNER_TEMP\okno"
          $code = $LASTEXITCODE
          Remove-Item fonts -Recurse -Force
          python -m pip uninstall -q -y pillow
          if ($code) { throw "small_window" }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: okno
          path: ${{ runner.temp }}/okno
          retention-days: 3
          if-no-files-found: ignore

      - name: ffmpeg i ffplay (Gyan full, shared)
        env:
          FFMPEG_TAG: ${{ inputs.ffmpeg_tag || '9.0.2' }}
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          Invoke-WebRequest -Uri "https://github.com/GyanD/codexffmpeg/releases/download/$env:FFMPEG_TAG/ffmpeg-$env:FFMPEG_TAG-full_build-shared.zip" -OutFile $zip
          if ($env:FFMPEG_TAG -eq "9.0.2") {
            $sum = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
            if ($sum -ne "8d31e162f1616e37aab3fa2db991b97e1b8dbeb1c8465fd81a81be16ff91b328") { throw "ffmpeg: inna suma ($sum)" }
          }
          $out = Join-Path $env:RUNNER_TEMP "ffmpeg"
          Expand-Archive $zip $out -Force
          $root = (Get-ChildItem $out -Directory | Select-Object -First 1).FullName
          $extras = Join-Path $env:RUNNER_TEMP "extras"
          Remove-Item (Join-Path $extras "ffmpeg.exe") -ErrorAction SilentlyContinue
          foreach ($exe in "ffmpeg.exe","ffplay.exe") {
            if (-not (Test-Path "$root\bin\$exe")) { throw "w buildzie ffmpeg brak $exe" }
            Copy-Item "$root\bin\$exe" $extras -Force
          }
          Copy-Item "$root\bin\*.dll" $extras -Force
          if (Test-Path "$root\LICENSE") { Copy-Item "$root\LICENSE" (Join-Path $extras "FFMPEG-LICENSE.txt") -Force }
          & "$extras\ffmpeg.exe" -hide_banner -version | Select-Object -First 1 | Write-Host
          & "$extras\ffplay.exe" -hide_banner -version | Select-Object -First 1 | Write-Host
          $dev = & "$extras\ffmpeg.exe" -hide_banner -devices 2>&1 | Out-String
          if ($dev -notmatch "dshow") { throw "ffmpeg bez dshow (mikrofon)" }
          Push-Location desktop\recorder
          $env:FF = "$extras\ffmpeg.exe"
          python -c "import os, record_app; record_app.mix_self_test(os.environ['FF'])"; if ($LASTEXITCODE) { throw "mix" }
          Pop-Location
          Get-ChildItem $extras | Measure-Object Length -Sum | ForEach-Object { "extras: $($_.Count) plików, $([math]::Round($_.Sum/1MB)) MB" } | Write-Host

      - name: PyInstaller
        working-directory: desktop/recorder
        run: |
          python -m pip install --upgrade pip pyinstaller==6.22.3 numpy==2.3.5
          pyinstaller BitRymDym.spec --noconfirm
          if ($LASTEXITCODE) { throw "pyinstaller" }
          Copy-Item "$env:RUNNER_TEMP\extras\*" "dist\BitRymDym" -Recurse -Force
          Get-ChildItem "dist\BitRymDym" | Select-Object Name, Length | Format-Table -AutoSize | Out-String -Width 200 | Write-Host

      - name: Smoke exe z katalogu dist
        working-directory: desktop/recorder
        run: |
          $note = Join-Path $env:TEMP "bitrymdym-exe-smoke.txt"
          Remove-Item $note -ErrorAction SilentlyContinue
          $env:BITRYMDYM_UI_SMOKE = "1"
          $p = Start-Process "dist\BitRymDym\BitRymDym.exe" -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw "smoke: program nie zakończył się w 90 s" }
          if (-not (Test-Path $note)) { throw "smoke: brak pliku wyniku" }
          Get-Content $note | Write-Host
          $text = Get-Content $note -Raw
          if ($text -notmatch "align=ok") { throw "smoke: wyrównanie do bitu nie działa w exe" }
          if ($text -notmatch "ffmpeg=") { throw "smoke: brak ffmpeg w wyniku" }
          if ($text -notmatch "ffplay=" -or $text -match "ffplay=None") { throw "smoke: program nie widzi ffplay" }

      - name: Velopack 1.2.161
        working-directory: desktop/recorder
        run: |
          dotnet tool install -g vpk --version 1.2.161
          if ($LASTEXITCODE) { throw "vpk install" }
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          $ver = (Select-String -Path updater.py -Pattern 'APP_VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          if ($ver -notmatch '^\d+\.\d+\.\d+$') { throw "vpk chce wersję z trzech liczb, jest $ver" }
          $out = "installer\velopack"
          New-Item -ItemType Directory -Force $out | Out-Null
          $notes = Join-Path $env:RUNNER_TEMP "brd-notes.md"
          Set-Content -Path $notes -Encoding utf8NoBOM -Value "Program sam wyrównuje głos do bitu."
          vpk pack --packId BitRymDym.Nagrywarka --packVersion $ver --packDir dist\BitRymDym --mainExe BitRymDym.exe --packTitle BitRymDym --icon assets\cassette.ico --outputDir $out --channel win --runtime win-x64 --shortcuts Desktop,StartMenuRoot --releaseNotes $notes
          if ($LASTEXITCODE) { throw "vpk pack" }
          $portable = Get-ChildItem $out -Filter *Portable.zip | Select-Object -First 1
          if (-not $portable) { throw "brak Portable.zip" }
          Copy-Item $portable.FullName "$out\BitRymDym-Portable.zip" -Force
          (Get-FileHash "$out\BitRymDym-Portable.zip" -Algorithm SHA256).Hash.ToLower() + "  BitRymDym-Portable.zip" | Out-File "$out\BitRymDym-Portable.zip.sha256" -Encoding ascii
          $setup = Get-ChildItem $out -Filter *Setup.exe | Select-Object -First 1
          if (-not $setup) { throw "brak Setup.exe" }
          Copy-Item $setup.FullName "$out\BitRymDym-Setup.exe" -Force
          (Get-FileHash "$out\BitRymDym-Setup.exe" -Algorithm SHA256).Hash.ToLower() + "  BitRymDym-Setup.exe" | Out-File "$out\BitRymDym-Setup.exe.sha256" -Encoding ascii
          if (-not (Test-Path "$out\releases.win.json")) { throw "brak releases.win.json" }
          $nupkg = Get-ChildItem $out -Filter *full.nupkg | Select-Object -First 1
          if (-not $nupkg) { throw "brak pelnej paczki" }
          Get-ChildItem $out | Select-Object Name, Length | Format-Table -AutoSize | Out-String | Write-Host

      - name: Cicha instalacja Velopack i smoke
        working-directory: desktop/recorder
        run: |
          Get-Process BitRymDym -ErrorAction SilentlyContinue | Stop-Process -Force
          $setup = "installer\velopack\BitRymDym-Setup.exe"
          $p = Start-Process $setup -ArgumentList "--silent" -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "Setup: czas" }
          if ($p.ExitCode -ne 0) { throw "Setup: kod $($p.ExitCode)" }
          $root = Join-Path $env:LOCALAPPDATA "BitRymDym.Nagrywarka"
          foreach ($need in @("Update.exe","current\BitRymDym.exe","current\ffmpeg.exe","current\ffplay.exe","current\fonts")) {
            if (-not (Test-Path (Join-Path $root $need))) { throw "po instalacji brak: $need" }
          }
          "Update.exe jest poziom wyżej niż current" | Write-Host
          Get-Process BitRymDym -ErrorAction SilentlyContinue | Stop-Process -Force
          $note = Join-Path $env:TEMP "bitrymdym-exe-smoke.txt"
          Remove-Item $note -ErrorAction SilentlyContinue
          $env:BITRYMDYM_UI_SMOKE = "1"
          $q = Start-Process (Join-Path $root "current\BitRymDym.exe") -PassThru
          if (-not $q.WaitForExit(90000)) { $q.Kill(); throw "smoke po instalacji: czas" }
          if (-not (Test-Path $note)) { throw "smoke po instalacji: brak wyniku" }
          $installed = Get-Content $note -Raw
          $installed | Write-Host
          if ($installed -notmatch "ffplay=" -or $installed -match "ffplay=None") { throw "po instalacji program nie widzi ffplay" }
          if ($installed -notmatch "ffmpeg\.exe") { throw "po instalacji program nie widzi ffmpeg" }

      - name: Portable - rozpakowanie, smoke i aktualizacja do nowszej wersji
        working-directory: desktop/recorder
        run: |
          Get-Process BitRymDym -ErrorAction SilentlyContinue | Stop-Process -Force
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          $root = Join-Path $env:RUNNER_TEMP "portable"
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive "installer\velopack\BitRymDym-Portable.zip" $root -Force
          Get-ChildItem $root -Force | Select-Object Name, Length | Format-Table -AutoSize | Out-String | Write-Host
          # Ten sam układ co po instalacji: przycisk Zaktualizuj szuka Update.exe poziom nad current.
          foreach ($need in @("Update.exe","BitRymDym.exe","current\BitRymDym.exe","current\ffmpeg.exe","current\ffplay.exe","current\fonts")) {
            if (-not (Test-Path (Join-Path $root $need))) { throw "portable: brak $need" }
          }
          $note = Join-Path $env:TEMP "bitrymdym-exe-smoke.txt"
          Remove-Item $note -ErrorAction SilentlyContinue
          $env:BITRYMDYM_UI_SMOKE = "1"
          $q = Start-Process (Join-Path $root "current\BitRymDym.exe") -PassThru
          if (-not $q.WaitForExit(90000)) { $q.Kill(); throw "portable smoke: czas" }
          if (-not (Test-Path $note)) { throw "portable smoke: brak wyniku" }
          $smoke = Get-Content $note -Raw
          $smoke | Write-Host
          if ($smoke -notmatch "ffplay=" -or $smoke -match "ffplay=None") { throw "portable: program nie widzi ffplay" }
          if ($smoke -notmatch "ffmpeg\.exe") { throw "portable: program nie widzi ffmpeg" }

          # Aktualizacja: paczka o numer nowsza, ta sama komenda co przycisk Zaktualizuj (updater.update_exe_args).
          $ver = (Select-String -Path updater.py -Pattern 'APP_VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          $parts = $ver.Split(".")
          $next = "$($parts[0]).$($parts[1]).$([int]$parts[2] + 1)"
          $nextOut = Join-Path $env:RUNNER_TEMP "velopack-next"
          vpk pack --packId BitRymDym.Nagrywarka --packVersion $next --packDir dist\BitRymDym --mainExe BitRymDym.exe --packTitle BitRymDym --icon assets\cassette.ico --outputDir $nextOut --channel win --runtime win-x64 --noPortable --noInst
          if ($LASTEXITCODE) { throw "vpk pack (nowsza)" }
          $pkg = Get-ChildItem $nextOut -Filter *full.nupkg | Select-Object -First 1
          if (-not $pkg) { throw "brak nowszej paczki" }
          $packages = Join-Path $root "packages"
          New-Item -ItemType Directory -Force $packages | Out-Null
          Copy-Item $pkg.FullName $packages -Force
          $target = Join-Path $packages $pkg.Name
          $u = Start-Process (Join-Path $root "Update.exe") -ArgumentList "apply","--package",$target,"--rootDir",$root,"--packageDir",$packages -PassThru
          if (-not $u.WaitForExit(180000)) { $u.Kill(); throw "portable: Update.exe apply - czas" }
          if ($u.ExitCode -ne 0) { throw "portable: Update.exe apply - kod $($u.ExitCode)" }
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            $sq = Join-Path $root "current\sq.version"
            if ((Test-Path $sq) -and ((Get-Content $sq -Raw) -match [regex]::Escape($next))) { $ok = $true; break }
            Start-Sleep -Seconds 1
          }
          Get-Process BitRymDym -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $ok) { throw "portable: po aktualizacji current nie ma wersji $next" }
          foreach ($need in @("current\BitRymDym.exe","current\ffmpeg.exe","current\ffplay.exe","current\fonts")) {
            if (-not (Test-Path (Join-Path $root $need))) { throw "portable po aktualizacji: brak $need" }
          }
          "portable: $ver -> $next zaktualizowany w miejscu" | Write-Host

      - uses: actions/upload-artifact@v4
        with:
          name: BitRymDym-Setup
          path: |
            desktop/recorder/installer/velopack/BitRymDym-Setup.exe
            desktop/recorder/installer/velopack/BitRymDym-Setup.exe.sha256
            desktop/recorder/installer/velopack/BitRymDym-Portable.zip
            desktop/recorder/installer/velopack/BitRymDym-Portable.zip.sha256
            desktop/recorder/installer/velopack/releases.win.json
            desktop/recorder/installer/velopack/*full.nupkg
          retention-days: 7
          if-no-files-found: error
