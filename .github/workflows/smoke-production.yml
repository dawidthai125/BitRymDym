name: Smoke test produkcji

# Called by deploy.yml after each deployment; deployment_status covers deploys built by Vercel (fallback).
on:
  workflow_call:
  deployment_status:
  workflow_dispatch:
  # Hourly/daily checks run on the Contabo host (scripts/site-watch.mjs + systemd timer):
  # GitHub scheduled runs did not fire for this repo (2026-11-22).

permissions:
  contents: read

jobs:
  smoke:
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Poczekaj na przepięcie domeny
        if: github.event_name != 'workflow_dispatch'
        run: sleep 20
      - name: Sprawdź www.bitrymdym.pl
        run: node scripts/smoke-production.mjs
