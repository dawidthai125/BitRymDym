name: recorder-fetch-artifact

# Jednorazowo: czeka na build Windows i wystawia pliki jako asset release.
# Tag nie pasuje do recorder-v*, więc nie startuje drugiego instalatora.

on:
  push:
    branches:
      - "fetch/recorder-2026.11.28"

permissions:
  actions: read
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Czekaj na build 43755367290
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for i in $(seq 1 80); do
            st=$(gh run view 43755367290 --repo dawidthai125/BitRymDym --json status,conclusion -q '.status+" "+(.conclusion//"")')
            echo "try $i $st"
            case "$st" in
              completed\ success) exit 0 ;;
              completed\ *) echo "build nie wyszedl: $st"; exit 1 ;;
            esac
            sleep 30
          done
          echo "timeout"
          exit 1

      - uses: actions/download-artifact@v4
        with:
          name: BitRymDym-Setup
          run-id: 43755367290
          github-token: ${{ github.token }}
          path: dist

      - name: Wystaw pliki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          find dist -type f -printf '%p %s\n'
          mapfile -t files < <(find dist -type f \( -name 'BitRymDym-Setup.exe' -o -name 'BitRymDym-Setup.exe.sha256' -o -name 'releases.win.json' -o -name '*full.nupkg' \))
          if [ "${#files[@]}" -lt 4 ]; then
            echo "za malo plikow: ${#files[@]}"
            exit 1
          fi
          gh release create recorder-asset-2026.11.28 \
            --repo dawidthai125/BitRymDym \
            --target 6ca4aa3d7389c13ff9f711b8210abb44a0e15f28 \
            --title "Nagrywarka 2026.11.28 pliki buildu" \
            --notes "Pliki buildu Windows. Instalator dla użytkowników idzie na R2." \
            "${files[@]}"
